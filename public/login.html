<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Log in — CivicLens AI</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #1c231f; --paper: #f6f4ee; --moss: #33513f; --moss-dark: #223a2c;
    --clay: #b5563a; --line: #d8d2c3; --card: #ffffff;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--paper); color: var(--ink); font-family: 'Inter', sans-serif; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
  .wrap { width: 100%; max-width: 400px; padding: 20px; }
  .brand { font-family: 'Fraunces', serif; font-weight: 600; font-size: 19px; color: var(--moss-dark); text-align: center; margin-bottom: 6px; text-decoration: none; display: block; }
  .brand span { color: var(--clay); }
  .sub { text-align: center; color: #6a7066; font-size: 13.5px; margin-bottom: 28px; }

  .card { background: var(--card); border: 1px solid var(--line); border-radius: 4px; padding: 28px; }
  .tabs { display: flex; border: 1px solid var(--line); border-radius: 20px; padding: 3px; margin-bottom: 24px; }
  .tab { flex: 1; text-align: center; padding: 8px; font-size: 13.5px; font-weight: 600; border-radius: 18px; cursor: pointer; color: #6a7066; }
  .tab.active { background: var(--moss-dark); color: #fff; }

  .field { margin-bottom: 16px; }
  label { display: block; font-size: 13.5px; font-weight: 600; margin-bottom: 6px; }
  input { width: 100%; padding: 11px 13px; border: 1px solid var(--line); border-radius: 3px; font-size: 15px; font-family: inherit; background: #fdfcfa; color: var(--ink); }
  input:focus { outline: 2px solid var(--moss); outline-offset: 1px; }

  button[type=submit] {
    width: 100%; margin-top: 6px; padding: 13px; background: var(--moss-dark); color: #fff; border: none;
    border-radius: 3px; font-family: inherit; font-size: 15px; font-weight: 600; cursor: pointer;
  }
  button[type=submit]:hover { background: var(--moss); }
  button[type=submit]:disabled { background: #a7ab9f; cursor: not-allowed; }

  .skip { display: block; text-align: center; margin-top: 16px; font-size: 13px; color: #6a7066; }

  #status { margin-top: 14px; font-size: 13.5px; min-height: 18px; text-align: center; }
  #status.err { color: var(--clay); font-weight: 600; }
  #status.ok { color: var(--moss-dark); font-weight: 600; }
</style>
</head>
<body>
<div class="wrap">
  <a class="brand" href="index.html">CivicLens <span>AI</span></a>
  <div class="sub">Telangana pilot</div>

  <div class="card">
    <div class="tabs">
      <div class="tab active" id="tabLogin">Log in</div>
      <div class="tab" id="tabSignup">Sign up</div>
    </div>

    <form id="authForm">
      <div class="field">
        <label for="email">Email</label>
        <input id="email" type="email" required placeholder="you@example.com" />
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input id="password" type="password" required minlength="6" placeholder="At least 6 characters" />
      </div>
      <button type="submit" id="submitBtn">Log in</button>
      <div id="status"></div>
    </form>

    <a class="skip" href="report.html">Skip for now — report without an account →</a>
  </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
  import {
    getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, onAuthStateChanged
  } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-auth.js";

  const firebaseConfig = {
    apiKey: "AIzaSyA5DiX2SLhKNWCz4iYRt2sMwU4bBy1jd8U",
    authDomain: "civiclens-ai-f82bb.firebaseapp.com",
    projectId: "civiclens-ai-f82bb",
    storageBucket: "civiclens-ai-f82bb.firebasestorage.app",
    messagingSenderId: "647394578869",
    appId: "1:647394578869:web:2bc1b9d86dcd94e00809fc",
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);

  let mode = "login";
  const tabLogin = document.getElementById("tabLogin");
  const tabSignup = document.getElementById("tabSignup");
  const submitBtn = document.getElementById("submitBtn");

  function setMode(next) {
    mode = next;
    tabLogin.classList.toggle("active", mode === "login");
    tabSignup.classList.toggle("active", mode === "signup");
    submitBtn.textContent = mode === "login" ? "Log in" : "Create account";
  }
  tabLogin.addEventListener("click", () => setMode("login"));
  tabSignup.addEventListener("click", () => setMode("signup"));

  const form = document.getElementById("authForm");
  const status = document.getElementById("status");

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;

    submitBtn.disabled = true;
    status.className = "";
    status.textContent = mode === "login" ? "Logging in…" : "Creating account…";

    try {
      if (mode === "login") {
        await signInWithEmailAndPassword(auth, email, password);
      } else {
        await createUserWithEmailAndPassword(auth, email, password);
      }
      status.className = "ok";
      status.textContent = "✅ Success — redirecting…";
      window.location.href = "report.html";
    } catch (err) {
      status.className = "err";
      status.textContent = friendlyError(err.code);
      submitBtn.disabled = false;
    }
  });

  function friendlyError(code) {
    const map = {
      "auth/email-already-in-use": "That email is already registered — try logging in instead.",
      "auth/invalid-email": "That doesn't look like a valid email address.",
      "auth/weak-password": "Password should be at least 6 characters.",
      "auth/user-not-found": "No account found with that email — try signing up.",
      "auth/wrong-password": "Incorrect password. Please try again.",
      "auth/invalid-credential": "Incorrect email or password.",
    };
    return "❌ " + (map[code] || "Something went wrong. Please try again.");
  }

  onAuthStateChanged(auth, (user) => {
    if (user) window.location.href = "report.html";
  });
</script>
</body>
</html>
