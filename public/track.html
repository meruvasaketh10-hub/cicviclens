<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Track a Report — CivicLens AI</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --blue: #12335e; --blue-dark: #0a1f3d; --yellow: #ffd300; --black: #0b0c0c;
    --bg: #ffffff; --panel: #f3f2f1; --line: #b1b4b6; --muted: #505a5f; --green: #00703c; --red: #d4351c;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--black); font-family: 'IBM Plex Sans', Arial, sans-serif; line-height: 1.5; }
  *:focus { outline: 3px solid var(--yellow); outline-offset: 0; }
  .tricolor { height: 4px; background: linear-gradient(90deg, #FF9933 0%, #FF9933 33%, #FFFFFF 33%, #FFFFFF 67%, #138808 67%); }
  header.top { background: var(--blue); color: #fff; padding: 14px 0; border-bottom: 6px solid var(--yellow); }
  .top-inner { max-width: 560px; margin: 0 auto; padding: 0 20px; display: flex; align-items: center; gap: 10px; }
  .brand { display: flex; align-items: center; gap: 10px; text-decoration: none; }
  .brand .mark { width: 32px; height: 32px; border-radius: 50%; background: #fff; display: flex; align-items: center; justify-content: center; font-size: 13px; color: var(--blue); font-weight: 700; border: 2px solid var(--yellow); }
  .brand .name { color: #fff; font-weight: 700; font-size: 17px; }

  .wrap { max-width: 560px; margin: 0 auto; padding: 36px 20px 80px; }
  h1 { font-size: 27px; font-weight: 700; margin: 0 0 10px; }
  .intro { color: var(--muted); font-size: 14.5px; margin: 0 0 26px; max-width: 55ch; }

  .card { background: var(--panel); border: 1px solid var(--line); border-top: 5px solid var(--blue); padding: 26px; }
  .searchRow { display: flex; gap: 10px; }
  input#codeInput {
    flex: 1; padding: 12px 13px; border: 2px solid var(--black); font-size: 16px; font-family: 'Courier New', monospace;
    text-transform: uppercase; letter-spacing: .04em;
  }
  button { padding: 0 22px; background: var(--blue); color: #fff; border: none; font-size: 14.5px; font-weight: 700; cursor: pointer; }
  button:hover { background: var(--blue-dark); }

  .result { margin-top: 24px; padding-top: 20px; border-top: 1px solid var(--line); display: none; }
  .result.show { display: block; }
  .statusPill { display: inline-block; padding: 5px 14px; font-size: 12.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .03em; margin-bottom: 14px; }
  .statusPill.new { background: #fff3cd; color: #664d03; border: 1px solid #ffe69c; }
  .statusPill.reviewed { background: #cfe2ff; color: #084298; border: 1px solid #9ec5fe; }
  .statusPill.resolved { background: #d1e7dd; color: var(--green); border: 1px solid #a3cfbb; }
  .row { margin-bottom: 10px; font-size: 14px; }
  .row .k { font-weight: 700; display: inline-block; min-width: 110px; color: var(--muted); }
  .err { color: var(--red); font-weight: 600; font-size: 14px; margin-top: 16px; }
  a.back { display: block; margin-top: 26px; font-size: 13px; color: var(--blue); font-weight: 600; }
</style>
</head>
<body>
<div class="tricolor"></div>
<header class="top">
  <div class="top-inner">
    <a class="brand" href="index.html"><div class="mark">CL</div><div class="name">CivicLens AI</div></a>
  </div>
</header>

<div class="wrap">
  <h1>Track your report</h1>
  <p class="intro">Enter the tracking code you received after submitting a report (e.g. CL-7K2M9P).</p>

  <div class="card">
    <div class="searchRow">
      <input id="codeInput" type="text" placeholder="CL-XXXXXX" maxlength="9" />
      <button id="searchBtn">Track</button>
    </div>
    <div class="err" id="err" style="display:none;"></div>

    <div class="result" id="result">
      <div class="statusPill" id="statusPill">New</div>
      <div class="row"><span class="k">District:</span> <span id="rDistrict"></span></div>
      <div class="row"><span class="k">Category:</span> <span id="rCategory"></span></div>
      <div class="row"><span class="k">Submitted:</span> <span id="rDate"></span></div>
      <div class="row"><span class="k">Summary:</span> <span id="rText"></span></div>
    </div>
  </div>

  <a class="back" href="report.html">← Submit a new report</a>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
  import { getFirestore, collection, query, where, getDocs, limit }
    from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyA5DiX2SLhKNWCz4iYRt2sMwU4bBy1jd8U",
    authDomain: "civiclens-ai-f82bb.firebaseapp.com",
    projectId: "civiclens-ai-f82bb",
    storageBucket: "civiclens-ai-f82bb.firebasestorage.app",
    messagingSenderId: "647394578869",
    appId: "1:647394578869:web:2bc1b9d86dcd94e00809fc",
  };
  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  const codeInput = document.getElementById("codeInput");
  const searchBtn = document.getElementById("searchBtn");
  const err = document.getElementById("err");
  const result = document.getElementById("result");
  const statusLabels = { new: "New — awaiting review", reviewed: "Reviewed", resolved: "Resolved" };

  async function doSearch() {
    const code = codeInput.value.trim().toUpperCase();
    err.style.display = "none";
    result.classList.remove("show");
    if (!code) return;

    searchBtn.disabled = true;
    searchBtn.textContent = "…";
    try {
      const q = query(collection(db, "complaints"), where("referenceCode", "==", code), limit(1));
      const snap = await getDocs(q);
      if (snap.empty) {
        err.textContent = "No report found with that code. Please check and try again.";
        err.style.display = "block";
        return;
      }
      const data = snap.docs[0].data();
      const st = (data.status || "new").toLowerCase();
      const pill = document.getElementById("statusPill");
      pill.textContent = statusLabels[st] || data.status;
      pill.className = "statusPill " + (statusLabels[st] ? st : "new");
      document.getElementById("rDistrict").textContent = data.district || "—";
      document.getElementById("rCategory").textContent = data.category || data.category_selected_by_citizen || "Not yet classified";
      document.getElementById("rDate").textContent = data.createdAt?.toDate
        ? data.createdAt.toDate().toLocaleDateString("en-IN", { day: "numeric", month: "short", year: "numeric" })
        : "—";
      document.getElementById("rText").textContent = data.summary || data.text || "—";
      result.classList.add("show");
    } catch (e) {
      err.textContent = "Something went wrong. Please try again.";
      err.style.display = "block";
      console.error(e);
    } finally {
      searchBtn.disabled = false;
      searchBtn.textContent = "Track";
    }
  }

  searchBtn.addEventListener("click", doSearch);
  codeInput.addEventListener("keydown", (e) => { if (e.key === "Enter") doSearch(); });
</script>
</body>
</html>
